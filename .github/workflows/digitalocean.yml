name: Deploy Frontend to DigitalOcean

on:
  push:
    branches:
      - feature-billing
  workflow_dispatch:

# Permissões necessárias para publicar no GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.prep.outputs.image_name }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Preparar nome da imagem
        id: prep
        run: |
          # GHCR exige nomes em letras minúsculas
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$REPO_LOWER" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$REPO_LOWER" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair REACT_APP_API_URL do Secret
        id: vars
        run: |
          # Extrai o valor da variável do secret FRONTEND_ENV
          URL=$(echo "${{ secrets.FRONTEND_ENV }}" | grep '^REACT_APP_API_URL=' | cut -d'=' -f2- | tr -d '\r' | xargs)
          META_APP_ID=$(echo "${{ secrets.FRONTEND_ENV }}" | grep '^REACT_APP_META_APP_ID=' | cut -d'=' -f2- | tr -d '\r' | xargs)
          META_CONFIG_ID=$(echo "${{ secrets.FRONTEND_ENV }}" | grep '^REACT_APP_META_CONFIG_ID=' | cut -d'=' -f2- | tr -d '\r' | xargs)
          echo "api_url=$URL" >> $GITHUB_OUTPUT
          echo "meta_app_id=$META_APP_ID" >> $GITHUB_OUTPUT
          echo "meta_config_id=$META_CONFIG_ID" >> $GITHUB_OUTPUT

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          build-args: |
            REACT_APP_API_URL=${{ steps.vars.outputs.api_url }}
            REACT_APP_META_APP_ID=${{ steps.vars.outputs.meta_app_id }}
            REACT_APP_META_CONFIG_ID=${{ steps.vars.outputs.meta_config_id }}
            REACT_APP_META_GRAPH_API_VERSION=v26.0
          # Cache para acelerar builds futuros
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DO_FRONTEND_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e # Para o script se qualquer comando falhar
            
            mkdir -p /app
            cd /app
            
            # Login no GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Limpeza preventiva para liberar RAM e Disco antes do pull
            echo "Limpando recursos para liberar memória..."
            docker system prune -f
            
            echo "${{ secrets.FRONTEND_ENV }}" > .env
            echo "BACKEND_UPSTREAM=http://${{ secrets.DO_BACKEND_IP }}:80" >> .env
            
            # --- CRIA O ARQUIVO DE PRODUÇÃO NA HORA ---
            cat <<EOF > docker-compose.prod.yml
            services:
              frontend:
                image: ghcr.io/${{ needs.build-and-push.outputs.image_name }}:latest
                container_name: sdr-frontend
                restart: unless-stopped
                ports:
                  - "80:80"
                env_file:
                  - .env
            EOF
            
            # --- SOBE A VERSÃO NOVA COM PULL ---
            echo "Fazendo pull da imagem nova..."
            docker compose -f docker-compose.prod.yml pull
            
            echo "Subindo container..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Verifica se subiu
            docker ps
