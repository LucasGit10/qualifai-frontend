name: Deploy Frontend to DigitalOcean

on:
  push:
    branches:
      - feature-billing
  workflow_dispatch:

# Permissões necessárias para publicar no GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.prep.outputs.image_name }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Preparar nome da imagem
        id: prep
        run: |
          # GHCR exige nomes em letras minúsculas
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$REPO_LOWER" >> $GITHUB_OUTPUT
          echo "IMAGE_NAME=$REPO_LOWER" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem Docker
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          # Cache para acelerar builds futuros
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DO_FRONTEND_IP }}
          username: root
          key: ${{ secrets.DO_SSH_KEY }}
          command_timeout: 60m
          script: |
            mkdir -p /app
            cd /app
            
            # Atualiza o código apenas para ter os arquivos de configuração
            if [ ! -d ".git" ]; then
              git clone --single-branch --branch feature-billing https://github.com/${{ github.repository }}.git .
            else
              git fetch origin feature-billing
              git reset --hard origin/feature-billing
            fi
            
            echo "${{ secrets.FRONTEND_ENV }}" > .env
            
            # --- LIMPEZA PARA EVITAR CONFLITOS ---
            echo "Limpando containers antigos..."
            # Para qualquer container que esteja usando a porta 80 (evita port is already allocated)
            docker ps -q --filter "publish=80" | xargs -r docker stop
            # Remove containers antigos pelos nomes conhecidos
            docker rm -f qualifai-frontend sdr-frontend || true
            # Limpa imagens órfãs para economizar espaço no disco (droplet de 1GB enche rápido)
            docker image prune -f
            
            # --- SOBE A VERSÃO NOVA ---
            echo "Subindo versão nova via GHCR..."
            export IMAGE_NAME=${{ needs.build-and-push.outputs.image_name }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            
            # Verifica se subiu
            docker ps
